<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>The Traitors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{
  --bg:#0d0b10;--panel:#17131c;--panel2:#211b28;--line:#30283a;--text:#f1e9dc;--muted:#a69b8d;
  --gold:#c9a45c;--gold2:#ecd394;--red:#a3232a;--red2:#e5484f;--green:#57a872;--amber:#d99a3a;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:radial-gradient(ellipse at 50% -10%,#2a1f2e 0%,#0d0b10 60%) fixed,var(--bg);color:var(--text);
  font-family:Inter,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.45;min-height:100vh;min-height:100dvh;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
.serif{font-family:Cinzel,Georgia,serif}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px calc(32px + env(safe-area-inset-bottom))}
.hwrap{max-width:1180px;margin:0 auto;padding:12px 16px 40px}
.center{text-align:center}
h1,h2,h3{font-family:Cinzel,Georgia,serif;font-weight:700;margin:.3em 0 .4em;letter-spacing:.03em}
h1.title{font-size:clamp(38px,11vw,64px);color:var(--gold2);margin-top:8vh;text-shadow:0 0 30px rgba(201,164,92,.25)}
h2{font-size:24px;color:var(--gold2)} h3{font-size:19px;color:var(--gold2)}
p{margin:.4em 0}
.muted{color:var(--muted)} .small{font-size:13px} .ok{color:var(--green);font-weight:600}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:8px;font-weight:600}
.btn{appearance:none;border:1px solid var(--line);background:#2a2331;color:var(--text);font:600 16px Inter,sans-serif;
  padding:13px 18px;border-radius:12px;cursor:pointer;width:100%;margin:6px 0;touch-action:manipulation}
.btn:active{transform:scale(.98)}
.btn.gold{background:linear-gradient(180deg,#d9b56b,#b38a3e);color:#1b1408;border-color:#e2c27f}
.btn.red{background:linear-gradient(180deg,#c7333a,#8f1d23);color:#fff;border-color:#d8474e}
.btn.ghost{background:transparent}
.btn.sm{width:auto;padding:9px 14px;font-size:14px;margin:4px 4px 4px 0}
.btn.xs{width:auto;padding:5px 10px;font-size:12px;margin:0;border-radius:8px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.big{font-size:19px;padding:18px}
input[type=text],input[type=number],textarea,select{width:100%;background:#0f0c13;border:1px solid var(--line);color:var(--text);
  border-radius:10px;padding:12px;font:16px Inter,sans-serif;margin:4px 0}
textarea{min-height:70px;resize:vertical}
input.codein{font:700 30px Cinzel,serif;text-align:center;letter-spacing:.3em;text-transform:uppercase}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#251f2c;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px}
.chip.dead{opacity:.45;text-decoration:line-through}
.chip.red{background:rgba(163,35,42,.25);border-color:var(--red2);color:#ffd9da}
.status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);justify-content:space-between}
.dot{width:9px;height:9px;border-radius:50%;background:#5c5363;display:inline-block;flex:none}
.dot.on{background:var(--green);box-shadow:0 0 8px var(--green)} .dot.warn{background:var(--amber)}
.pot{font-family:Cinzel,serif;font-size:40px;color:var(--gold2);text-align:center;font-weight:900}
.potbar{height:8px;background:#0f0c13;border-radius:99px;overflow:hidden;margin-top:6px}
.potbar>i{display:block;height:100%;background:linear-gradient(90deg,#8a6a2c,var(--gold2))}
.goal{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.goal:first-child{border-top:0}
.goal .tick{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-weight:900;color:#1b1408}
.goal.done .tick{background:var(--gold);border-color:var(--gold)}
.goal .val{margin-left:auto;color:var(--gold2);font-weight:700;white-space:nowrap}
.hold{background:#1b1620;border:1px dashed #5a4c66;color:var(--muted);text-align:center;padding:18px;border-radius:14px;margin:12px 0;
  touch-action:none;cursor:pointer;font-weight:600}
.hold:active{background:#241c2b}
.votebtn{display:flex;justify-content:space-between;align-items:center;text-align:left}
.votebtn.on{border-color:var(--gold);background:#3a2e1c;color:var(--gold2)}
.banner{border-radius:12px;padding:12px 14px;margin:10px 0;font-weight:600}
.banner.dead{background:#232428;color:#c9ccd3;border:1px solid #3b3d44}
/* overlay */
#overlay{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px 20px calc(24px + env(safe-area-inset-bottom))}
#overlay[hidden]{display:none}
.dnr{font-family:Cinzel,serif;font-size:clamp(34px,10vw,56px);color:#fff;letter-spacing:.04em}
.count{font-family:Cinzel,serif;font-size:min(42vw,220px);color:#fff;line-height:1;animation:pulse 1s ease-out}
@keyframes pulse{from{transform:scale(1.35);opacity:0}30%{opacity:1}to{transform:scale(1);opacity:.9}}
@keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.result{animation:rise .6s ease-out;width:100%;max-width:520px}
.ev-title{font-size:20px;color:#cfc6b8;margin-bottom:6px}
.bigword{font-family:Cinzel,serif;font-weight:900;font-size:clamp(40px,14vw,92px);letter-spacing:.05em;line-height:1.05;margin:8px 0 14px;word-break:break-word}
.tone-traitor .bigword{color:var(--red2);text-shadow:0 0 40px rgba(229,72,79,.55)}
.tone-faithful .bigword{color:var(--gold2);text-shadow:0 0 40px rgba(236,211,148,.35)}
.tone-dead .bigword{color:#9da3ad}
.tone-neutral .bigword{color:#fff}
.sub{font-size:18px;color:#e3dacb;margin:8px 0}
.night{background:#000;position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;z-index:5}
.night .moon{width:90px;height:90px;border-radius:50%;box-shadow:-18px 10px 0 0 #3d3a46;margin-bottom:24px}
/* host */
.hbar{display:flex;justify-content:space-between;align-items:center;padding:6px 0 10px;border-bottom:1px solid var(--line);margin-bottom:8px;gap:8px;flex-wrap:wrap}
.hbar .brand{font-family:Cinzel,serif;font-weight:900;color:var(--gold2);font-size:20px}
.roomcode{font-family:Cinzel,serif;font-weight:900;letter-spacing:.2em;color:var(--gold2)}
.grid{display:grid;grid-template-columns:1fr;gap:0 18px}
@media(min-width:900px){.grid{grid-template-columns:1.5fr 1fr}}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.tab{flex:none;background:#1c1721;border:1px solid var(--line);color:var(--text);border-radius:999px;padding:9px 14px;font:600 14px Inter;cursor:pointer;display:flex;gap:6px;align-items:center}
.tab.on{background:var(--gold);color:#1b1408;border-color:var(--gold)}
.live{font-size:10px;background:var(--red);color:#fff;border-radius:6px;padding:2px 5px;letter-spacing:.08em}
.prow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.prow .pname{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow.dead .pname{opacity:.5;text-decoration:line-through}
.badge{font-size:11px;font-weight:800;letter-spacing:.1em;padding:4px 8px;border-radius:6px;text-transform:uppercase;background:#2c2733;color:var(--gold2)}
.badge.traitor{background:var(--red);color:#fff}
.fate{font-size:12px;color:var(--muted)}
.qrbox{background:#fff;border-radius:14px;padding:10px;width:min(240px,70vw);margin:8px auto}
.qrbox svg{width:100%;height:auto;display:block}
.link{word-break:break-all;font-size:14px;background:#0f0c13;border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;-webkit-user-select:all;user-select:all}
.secretbox{background:rgba(163,35,42,.15);border:1px solid rgba(229,72,79,.5);border-radius:12px;padding:12px;margin:10px 0}
.tally{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.tally:first-child{border-top:0}
.logline{font-size:13px;color:var(--muted);padding:3px 0}
.hgoal{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;margin:6px 0;cursor:pointer}
.hgoal.done{border-color:var(--gold);background:#2e2517}
.hgoal input{width:22px;height:22px;accent-color:var(--gold)}
.goalrow{display:grid;grid-template-columns:1fr 80px 40px;gap:6px;align-items:center}
.field{margin:10px 0}
.field>.label{margin-bottom:2px}
.tvmode .wrap,.tvwrap{max-width:none}
.tvwrap{padding:2.2vw 3vw;min-height:100vh}
.tvhead{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:1vw;margin-bottom:2vw}
.tvbrand{font-family:Cinzel,serif;font-size:3.2vw;color:var(--gold2);font-weight:900;letter-spacing:.04em}
.tvphase{font-family:Cinzel,serif;font-size:2.2vw;color:var(--muted)}
.tvgrid{display:grid;grid-template-columns:1.45fr 1fr;gap:2vw;align-items:start}
.tvcard{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:1.2vw;padding:2vw;margin-bottom:2vw}
.tvlabel{font-size:1.1vw;text-transform:uppercase;letter-spacing:.15em;color:var(--muted);font-weight:600;margin-bottom:.8vw}
.tvbig{font-family:Cinzel,serif;font-weight:900;font-size:4.2vw;color:var(--gold2);line-height:1.1;margin:.2em 0 .3em}
.tvtext{font-size:1.8vw;line-height:1.4}
.tvpot{font-family:Cinzel,serif;font-weight:900;font-size:7vw;color:var(--gold2);text-align:center;line-height:1}
.tvtimer{font-family:Cinzel,serif;font-weight:900;font-size:6.5vw;text-align:center;font-variant-numeric:tabular-nums;line-height:1;color:#fff}
.tvtimer.low,.tvtimer.done{color:var(--red2)}
.tvmode .chips{gap:.6vw}.tvmode .chip{font-size:1.6vw;padding:.5vw 1.2vw}
.tvmode .goal{font-size:1.9vw;padding:1vw 0}.tvmode .goal .tick{width:2.4vw;height:2.4vw;font-size:1.5vw}
.tvmode .potbar{height:1vw;margin-top:1.2vw}
.tvqr{background:#fff;border-radius:1vw;padding:1vw;width:26vw;margin:0 auto}.tvqr svg{width:100%;height:auto;display:block}
.tvmode .bigword{font-size:10vw}.tvmode .dnr{font-size:6.5vw}.tvmode .sub{font-size:2.6vw}.tvmode .ev-title{font-size:3.2vw}.tvmode .count{font-size:24vw}
.tvmode .night h2{font-size:5vw}.tvmode .night p{font-size:2.2vw}.tvmode .night .moon{width:9vw;height:9vw;box-shadow:-1.8vw 1vw 0 0 #3d3a46}
.tvmode .tally{font-size:2vw;padding:.8vw 0}
.tvmode .result{max-width:none}
.tvlist{font-size:1.6vw;padding:.4vw 0}
#overlay.intro{padding:0;background:radial-gradient(ellipse at 50% 30%,#2a1f2e 0%,#07060a 70%)}
.iwrap{position:absolute;inset:0;display:grid;grid-template-rows:1fr auto;padding:3vw 4vw 2.5vw}
.istage{display:flex;align-items:center;justify-content:center;gap:4vw;min-height:0;position:relative;overflow:hidden;padding-bottom:1.5vw}
.icap{text-align:center;max-width:78vw;margin:0 auto;animation:rise .8s ease-out}
.ititle2{font-family:Cinzel,serif;font-weight:900;color:var(--gold2);font-size:3.4vw;letter-spacing:.04em}
.isub{font-size:2vw;color:#e3dacb;line-height:1.35;margin-top:.8vw}
.iprog{position:absolute;top:1.6vw;right:2vw;font-size:1.1vw;color:var(--muted);letter-spacing:.15em}
.iskip{position:absolute;top:1.6vw;left:2vw;font-size:1.1vw;color:var(--muted)}
.ilogo{font-family:Cinzel,serif;font-weight:900;font-size:min(11vw,22vh);color:var(--gold2);text-shadow:0 0 4vw rgba(236,211,148,.35);animation:glow 3s ease-in-out infinite, rise 1.6s ease-out}
@keyframes glow{50%{text-shadow:0 0 6vw rgba(236,211,148,.6)}}
.icandles{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:space-around}
.icandle{width:1.4vw;height:8vw;background:linear-gradient(#efe2c4,#b9a77f);border-radius:.3vw;position:relative}
.icandle:before{content:"";position:absolute;left:50%;top:-2.4vw;width:1.2vw;height:2.2vw;margin-left:-.6vw;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(#fff6c8,#ffb43a 60%,transparent 70%);animation:flick .15s infinite alternate;box-shadow:0 0 3vw 1vw rgba(255,170,60,.35)}
@keyframes flick{to{transform:scale(.92,1.06) translateX(.08vw);opacity:.9}}
.iphone{height:min(32vw,50vh);width:calc(min(32vw,50vh)*.53);border-radius:2.4vw;border:.5vw solid #2b2532;background:#000;box-shadow:0 2vw 5vw rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;text-align:center;padding:1.5vw;position:relative;animation:rise .6s ease-out}
.iscr{width:100%}
.iscr .w{font-family:Cinzel,serif;font-weight:900;font-size:2.6vw;line-height:1.1;animation:rise .5s ease-out}
.iscr .n{font-family:Cinzel,serif;font-size:9vw;color:#fff;animation:pulse 1s ease-out}
.iscr .s{font-size:1.2vw;color:#cfc6b8;margin-top:.6vw}
.gold{color:var(--gold2)!important;text-shadow:0 0 2vw rgba(236,211,148,.4)}.red{color:var(--red2)!important;text-shadow:0 0 2vw rgba(229,72,79,.5)}.grey{color:#9da3ad!important}
.ihold{margin-top:1vw;border:.15vw dashed #5a4c66;border-radius:1vw;padding:1vw;font-size:1.1vw;color:var(--muted)}
.ifinger{position:absolute;bottom:6vw;left:50%;width:4vw;height:4vw;margin-left:-2vw;border-radius:50%;background:rgba(236,211,148,.25);border:.2vw solid var(--gold2);animation:press 3s ease-in-out infinite}
@keyframes press{0%,100%{transform:scale(1);opacity:.4}20%,70%{transform:scale(.8);opacity:1}}
.icard{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:1.4vw;padding:2vw 2.4vw;min-width:36vw;animation:rise .6s ease-out}
.icard .goal{font-size:1.8vw}.icard .goal .tick{width:2.2vw;height:2.2vw;font-size:1.4vw}
.ipot{font-family:Cinzel,serif;font-weight:900;font-size:8vw;color:var(--gold2);line-height:1;transition:color .3s}
.ipot.hit{color:var(--red2);animation:shake .5s}
@keyframes shake{20%,60%{transform:translateX(-1vw)}40%,80%{transform:translateX(1vw)}}
.ibadge{font-family:Cinzel,serif;font-size:3vw;font-weight:900;animation:rise .5s ease-out}
.ishield{font-size:min(16vw,34vh);line-height:1;animation:shieldp 2.4s ease-in-out infinite;filter:drop-shadow(0 0 3vw rgba(236,211,148,.5))}
@keyframes shieldp{50%{transform:scale(1.08);filter:drop-shadow(0 0 5vw rgba(236,211,148,.8))}}
.ivotes{width:44vw}
.ivrow{display:flex;align-items:center;gap:1vw;font-size:1.9vw;margin:.7vw 0}
.ivrow b{width:9vw}
.ivbar{height:2vw;background:linear-gradient(90deg,#8a6a2c,var(--gold2));border-radius:.4vw;width:0;transition:width .8s ease-out}
.ivrow.out b{color:var(--red2)}
.inight{position:absolute;inset:0;background:#000;opacity:0;transition:opacity 2s}
.inight.on{opacity:.85}
.imoon{position:absolute;top:2vw;right:12vw;width:8vw;height:8vw;border-radius:50%;box-shadow:-1.6vw 1vw 0 0 #d7d2e0;transform:translateY(10vw);opacity:0;transition:all 2.5s ease-out}
.imoon.on{transform:none;opacity:1}
.ibig{font-family:Cinzel,serif;font-weight:900;font-size:5vw;position:relative;z-index:2;text-align:center;animation:rise .7s ease-out}
.ipoint{font-size:8vw;position:relative;z-index:2;animation:pointp 1.2s ease-in-out infinite}
@keyframes pointp{50%{transform:translateX(2vw)}}
.iwin{display:flex;gap:3vw}
.iwin .icard{min-width:0;width:34vw;text-align:center}
.irules{display:flex;flex-direction:column;gap:2vw}
.irule{font-family:Cinzel,serif;font-size:3.6vw;color:var(--gold2);opacity:0;transform:translateX(-3vw);transition:all .8s ease-out}
.irule.on{opacity:1;transform:none}
.ihidden{opacity:0}
.mdock{position:fixed;right:12px;bottom:12px;z-index:60;width:min(380px,calc(100vw - 24px));background:var(--panel2);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.55)}
.mbar{display:flex;gap:6px;align-items:center;padding:8px}
.mbar .mnow{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:12px;color:var(--muted)}
.mbody{padding:0 8px 10px}
.mdock.min .mbody{height:0;overflow:hidden;padding:0}
.mtracks{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.mtracks{flex-direction:column;flex-wrap:nowrap;max-height:240px;overflow-y:auto;gap:2px}
.mtrack{appearance:none;display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:transparent;border:0;border-radius:8px;padding:6px 8px;color:var(--text);font:inherit;font-size:13px;cursor:pointer}
.mtrack:hover{background:#2a2331}
.mtrack.on{background:#3a2e1c;color:var(--gold2)}
.mtrack .mn{width:18px;color:var(--muted);font-size:11px;flex:none}
.mtrack .mtt{flex:1;min-width:0;display:flex;flex-direction:column}
.mtrack .mtt small{color:var(--muted);font-size:11px}
.mtrack .mlen{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:600;flex:none}
.mbody input[type=range]{width:100%;accent-color:var(--gold)}
.hwrap{padding-bottom:110px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;max-height:460px;overflow-y:auto;padding:2px;margin-bottom:10px}
.mcard{appearance:none;text-align:left;border:1px solid var(--line);border-radius:12px;padding:10px;background:#1b1620;color:var(--text);cursor:pointer;font:inherit;display:flex;flex-direction:column;gap:4px}
.mcard:hover{border-color:#5a4c66}
.mcard.sel{border-color:var(--gold);background:#2e2517;box-shadow:0 0 0 1px var(--gold)}
.mcard.done{opacity:.5}
.mcard.done.sel{opacity:1}
.mcard .mt{font-weight:700;color:var(--gold2);font-size:15px}
.mcard .ms{font-size:13px;color:#d9cfc0}
.mtags{display:flex;gap:4px;flex-wrap:wrap}
.mtag{font-size:11px;padding:2px 6px;border-radius:6px;background:#2c2733;color:var(--muted)}
.mtag.fit3{background:#1f3a28;color:#9fe0b4}.mtag.fit2{background:#3a3220;color:#f0d9a5}.mtag.fit0{background:#3a1f22;color:#ffb3b6}
.mtag.okt{background:var(--green);color:#0b1a10;font-weight:700}
.msh{font-size:12px;color:var(--gold)}
.tcard{padding:12px 14px}
.trow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tdisp{font-family:Cinzel,serif;font-weight:900;font-size:46px;color:var(--gold2);font-variant-numeric:tabular-nums;min-width:150px;line-height:1}
.tdisp.low{color:var(--red2)}
.tdisp.done{color:var(--red2);animation:flash .5s ease-in-out 8}
@keyframes flash{50%{opacity:.15}}
.tbtns{display:flex;gap:4px;flex-wrap:wrap;flex:1;justify-content:flex-end}
.tpre{flex-wrap:wrap;gap:6px;margin-top:8px}.tpre>*{flex:none}

/* ============ LANDING ============ */
function landing(){
  var last=LS.get('traitors-last-host',null);
  app.innerHTML='<div class="wrap center">'+
   '<h1 class="serif title">The Traitors</h1><p class="muted">At-home edition</p>'+
   '<div class="card" style="text-align:left"><div class="label">Join a game</div>'+
   '<input id="code" class="codein" type="text" maxlength="6" placeholder="CODE" autocomplete="off" autocapitalize="characters">'+
   '<button class="btn gold" id="joinBtn">Enter the castle</button></div>'+
   '<div class="card" style="text-align:left"><div class="label">Running the game?</div>'+
   '<button class="btn" id="hostBtn">Host a new game as Claudia</button>'+
   (last?'<button class="btn ghost" id="resumeBtn">Resume hosting room '+esc(last)+'</button>':'')+
   '</div></div>';
  document.getElementById('joinBtn').onclick=function(){var c=document.getElementById('code').value.toUpperCase().replace(/[^A-Z0-9]/g,'');if(c)location.search='?room='+c};
  document.getElementById('code').onkeydown=function(e){if(e.key==='Enter')document.getElementById('joinBtn').click()};
  document.getElementById('hostBtn').onclick=function(){
    if(last&&!confirm('Start a brand new room? (Your previous room '+last+' is still saved and can be resumed later.)'))return;
    location.search='?host&room='+newCode()};
  var r=document.getElementById('resumeBtn'); if(r) r.onclick=function(){location.search='?host&room='+last};
}

/* ============ HOST ============ */
function hostMain(){
  var KEY='traitors-host-'+ROOM;
  function blankState(prev){
    var s={v:1,code:ROOM,started:false,phase:'lobby',round:0,players:{},order:[],kicked:[],pot:0,potMax:50,cur:'£',
      mission:null,vote:null,event:null,stash:0,done:{},timer:{total:180000,left:180000,endAt:null,phones:true},seq:prev?prev.seq:0,winner:null,log:[]};
    if(prev){
      s.cur=prev.cur;s.potMax=prev.potMax;s.kicked=prev.kicked||[];
      prev.order.forEach(function(id){var p=prev.players[id];if(!p)return;s.players[id]={id:id,name:p.name,role:'faithful',alive:true,fate:null};s.order.push(id)});
    }
    return s;
  }
  var S=LS.get(KEY,null); if(!S||S.code!==ROOM) S=blankState(null);
  if(!S.timer) S.timer={total:180000,left:180000,endAt:null,phones:true};
  if(S.stash==null) S.stash=0;
  if(!S.done) S.done={};
  LS.set('traitors-last-host',ROOM);
  var tvs=[],introOn=false,introPage=0,introVoice=LS.get('traitors-intro-voice',true);
  var conns={}, allConns=[], peer=null, peerStatus='Starting…', peerLive=false;
  var ui={tab:null,hideRoles:false,steal:5,pick:null,mfilter:'all',draft:{title:'',desc:'',goals:[['',2]],secret:'',mins:3,shield:''},banishPick:'',murder:'',recruit:'',winner:'auto'};

  function log(m){S.log.unshift({t:Date.now(),m:m});if(S.log.length>60)S.log.length=60}
  function P(id){return S.players[id]}
  function list(){return S.order.map(P).filter(Boolean)}
  function alive(){return list().filter(function(p){return p.alive})}
  function nameOf(id){var p=P(id);return p?p.name:'?'}
  function money(n){return fmtMoney(S.cur,n)}
  function traitorsAlive(){return alive().filter(function(p){return p.role==='traitor'})}
  function faithfulAlive(){return alive().filter(function(p){return p.role!=='traitor'})}

  /* ---- networking ---- */
  function startPeer(){
    if(typeof Peer==='undefined'){peerStatus='Could not load the connection library. Check the internet connection, then reload.';render();return}
    peerStatus='Opening the castle doors…';peerLive=false;
    var p=new Peer(PEER_PREFIX+ROOM,{debug:1}); peer=p;
    p.on('open',function(){if(peer!==p)return;peerLive=true;peerStatus='Live';render()});
    p.on('connection',function(c){setupConn(c)});
    p.on('disconnected',function(){if(peer!==p)return;peerLive=false;peerStatus='Reconnecting…';render();setTimeout(function(){try{if(!p.destroyed&&p.disconnected)p.reconnect()}catch(e){}},800)});
    p.on('error',function(e){
      if(peer!==p)return;
      if(e.type==='unavailable-id'){
        peerStatus='Room is still held by an old session. Retrying… (if this is open on another device, close it there)';
        peerLive=false;render();peer=null;try{p.destroy()}catch(_){};setTimeout(startPeer,3000);
      } else if(e.type==='peer-unavailable'){ /* ignore */ }
      else {peerStatus='Network hiccup ('+e.type+'). Retrying…';render()}
    });
  }
  setInterval(function(){
    if(!peer) return;

  },4000);
  setInterval(function(){
    allConns=allConns.filter(function(c){return c.open||!c._dead});

  },4000);

  function setupConn(c){
    var pid=null; allConns.push(c);
    c.on('open',function(){try{c.send({t:'welcome',started:S.started})}catch(e){}});
    c.on('data',function(m){
      if(!m||typeof m!=='object')return;
      if(m.t==='introAt'){introPage=+m.i||0;introOn=true;render();return}
      if(m.t==='introDone'){introOn=false;if(musicLevel)musicLevel(1);render();return}
      if(m.t==='hello'&&m.tv){if(tvs.indexOf(c)<0)tvs.push(c);try{c.send({t:'tv',v:tvView()})}catch(e){}render();return}
      if(m.t==='hello'){
        var id=String(m.id||'').slice(0,40), name=String(m.name||'').trim().slice(0,20);
        if(!id||!name)return;
        if(S.kicked.indexOf(id)>=0){c.send({t:'rejected',reason:'Claudia removed you from this game.',kicked:true});return}
        var p=S.players[id];
        if(!p){
          if(S.started){c.send({t:'rejected',reason:'This game has already started. Ask Claudia to start a new game to join in.'});return}
          p=S.players[id]={id:id,name:name,role:'faithful',alive:true,fate:null};S.order.push(id);log(name+' entered the castle');
        } else if(!S.started && p.name!==name){p.name=name}
        pid=id;
        var old=conns[id]; if(old&&old!==c){try{old.close()}catch(e){}}
        conns[id]=c; commit();
      } else if(m.t==='vote'&&pid){
        vote(pid,m.target);
      }
    });
    c.on('close',function(){c._dead=true;var ti=tvs.indexOf(c);if(ti>=0){tvs.splice(ti,1);render()}if(pid&&conns[pid]===c){delete conns[pid];render()}});
    c.on('error',function(){});
  }
  function broadcast(){
    Object.keys(conns).forEach(function(id){var c=conns[id];if(c&&c.open){try{c.send({t:'view',v:viewFor(id)})}catch(e){}}});
    if(tvs.length){var tv=tvView();tvs.forEach(function(c){if(c.open){try{c.send({t:'tv',v:tv})}catch(e){}}})}

  function commit(){LS.set(KEY,S);broadcast();render()}

  /* ---- per-player view (only what that phone may know) ---- */
  function allyNames(pid){return list().filter(function(p){return p.role==='traitor'&&p.alive&&p.id!==pid}).map(function(p){return p.name})}
  function personalEvent(pid){
    var e=S.event;if(!e)return null;var me=P(pid);if(!me)return null;
    var out={seq:e.seq,kind:e.kind,title:'',big:'',sub:'',tone:'neutral',allies:null};
    if(e.kind==='roles'){
      out.title='You are…';
      if(me.role==='traitor'){out.big='Traitor';out.tone='traitor';out.allies=allyNames(pid);out.sub=out.allies.length?'Your fellow Traitors:':'You are the only Traitor. Trust no one.'}
      else{out.big='Faithful';out.tone='faithful';out.sub='Find the Traitors. Banish them all.'}
    } else if(e.kind==='morning'){
      var mName=e.murdered?nameOf(e.murdered):null;
      if(pid===e.shielded){out.title='In the night…';out.big='Shielded';out.tone='faithful';out.sub='The Traitors came for you, but your Shield saved you. Tell people… or keep it to yourself.'}
      else if(pid===e.murdered){out.title='In the night…';out.big='Murdered';out.tone='dead';out.sub='The Traitors came for you. You are now a ghost: watch, but stay silent.'}
      else if(pid===e.recruited){out.title='In the night…';out.big='Recruited';out.tone='traitor';out.allies=allyNames(pid);
        out.sub='The Traitors have chosen you. You are now a TRAITOR.'+(mName?' Also, '+mName+' was murdered.':'')+(out.allies.length?' Your fellow Traitors:':'')}
      else{out.title='Last night…';out.big=mName||'No one';out.tone=mName?'dead':'neutral';out.sub=mName?'was murdered.':'was murdered. Everyone survived the night.';
        if(me.role==='traitor'&&e.shielded&&me.alive){out.sub+=' Your target was protected by a Shield.'}
        if(me.role==='traitor'&&e.recruited&&me.alive){out.sub+=' '+nameOf(e.recruited)+' has joined the Traitors.'}}
    } else if(e.kind==='sabotage'){
      out.title='Sabotage!';out.big='−'+money(e.amount);out.tone='traitor';
      out.sub=me.role==='traitor'?'Your secret task worked. The Traitors\' stash is now '+money(S.stash)+', yours to share at the end, win or lose.':'The Traitors pulled off a secret task under your noses. That money has vanished from the prize fund.';
    } else if(e.kind==='shield'){
      if(pid!==e.target)return null;
      out.title='You have won';out.big='A Shield';out.tone='faithful';out.sub='You cannot be murdered tonight. Tell people… or keep it secret.';
    } else if(e.kind==='banish'){
      var t=P(e.target);var tn=t?t.name:'?';
      out.title=pid===e.target?'You have been banished. You were…':tn+' was…';
      out.big=cap(e.role);out.tone=e.role==='traitor'?'traitor':'faithful';
      out.sub=e.role==='traitor'?'A Traitor has been caught!':'An innocent Faithful has fallen.';
    } else if(e.kind==='end'){
      var win=e.winner;var mine=(me.role==='traitor')===(win==='traitors');
      out.title=mine?'Victory!':'Defeat…';
      out.big=win==='traitors'?'Traitors win':'Faithful win';out.tone=win==='traitors'?'traitor':'faithful';
      var winners=list().filter(function(p){return p.alive&&((p.role==='traitor')===(win==='traitors'))}).map(function(p){return p.name});
      out.sub='Prize fund: '+money(S.pot)+(winners.length?'. Shared by: '+winners.join(', '):'')+(S.stash?'. Traitors\' stash: '+money(S.stash)+', shared by every Traitor, win or lose.':'');
    }
    return out;
  }

      me:{id:me.id,name:me.name,alive:me.alive,fate:me.fate,role:S.started?me.role:null,shield:!!me.shield},
      stash:(me.role==='traitor'||showAll)?S.stash:null,

    if(!S.vote||!S.vote.open)return;var me=P(pid);if(!me||!me.alive)return;
    if(target==null){delete S.vote.votes[pid];commit();return}
    var t=P(target);if(!t||!t.alive||target===pid)return;
    S.vote.votes[pid]=target;commit();
  }

    return Object.keys(c).map(function(t){return {id:t,voters:c[t]}}).sort(function(a,b){return b.voters.length-a.voters.length});
  }

  function missionPicker(){

      return (sizeFit(B,N)-sizeFit(A,N))||((S.done[A.title]?1:0)-(S.done[B.title]?1:0))||((A.props?1:0)-(B.props?1:0))||(a-b)});

/* ============ PLAYER ============ */
function playerMain(){
  var KEY='traitors-p-'+ROOM;
  var me=LS.get(KEY,null);if(!me||!me.id)me={id:rid(),name:'',seen:0};LS.set(KEY,me);
  var peer=null,conn=null,lastMsg=0,connecting=0,view=null,live=false,status='Connecting…',rejected=null,showing=false;

  function save(){LS.set(KEY,me)}
  function money(n){return fmtMoney(view?view.cur:'£',n)}

  function makePeer(){
    if(typeof Peer==='undefined'){status='Could not load. Check your internet connection and reload.';paintStatus();return}
    var p=new Peer(undefined,{debug:1});peer=p;
    p.on('open',function(){if(peer===p)openConn()});
    p.on('disconnected',function(){if(peer!==p)return;setTimeout(function(){try{if(!p.destroyed&&p.disconnected)p.reconnect()}catch(e){}},500)});
    p.on('error',function(e){
      if(peer!==p)return;
      if(e.type==='peer-unavailable'){status='Waiting for Claudia to open the castle…';live=false;connecting=Date.now()-3500;paintStatus()}
      else if(e.type==='network'||e.type==='server-error'||e.type==='socket-error'||e.type==='socket-closed'){status='Connection trouble, retrying…';live=false;paintStatus()}
    });
  }
  function openConn(){
    if(!peer||!peer.open)return;
    connecting=Date.now();
    var old=conn;conn=null;if(old){try{old.close()}catch(e){}}
    var c=peer.connect(PEER_PREFIX+ROOM,{reliable:true});conn=c;
    c.on('open',function(){if(conn!==c)return;lastMsg=Date.now();live=true;status='Live';if(me.name)hello();paintStatus()});
    c.on('data',function(m){if(conn!==c)return;lastMsg=Date.now();if(!live){live=true;paintStatus()}onMsg(m)});
    c.on('close',function(){if(conn!==c)return;live=false;status='Reconnecting…';connecting=0;paintStatus()});
    c.on('error',function(){});
  }
  function hello(){if(conn&&conn.open)try{conn.send({t:'hello',id:me.id,name:me.name})}catch(e){}}
  function send(m){if(conn&&conn.open){try{conn.send(m);return true}catch(e){}}return false}
  function tick(){
    if(rejected&&rejected.kicked)return;
    if(typeof Peer==='undefined'){status='Could not load. Check your internet connection and reload.';paintStatus();return}
    if(!peer||peer.destroyed){makePeer();return}
    if(peer.disconnected){try{peer.reconnect()}catch(e){}return}
    if(!peer.open)return;
    var stale=Date.now()-lastMsg>11000;
    if(live&&stale){live=false;status='Reconnecting…';paintStatus()}
    if((!conn||!conn.open||stale)&&Date.now()-connecting>6000)openConn();
  }
  setInterval(tick,2000);
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'){lastMsg=Math.min(lastMsg,Date.now()-11000+2500);tick()}});
  window.addEventListener('online',tick);

  function onMsg(m){
    if(!m||typeof m!=='object')return;
    if(m.t==='view'){view=m.v;view._recv=Date.now();rejected=null;render()}
    else if(m.t==='rejected'){rejected=m;render()}
  }

  /* ---- reveal sequence ---- */
  var token=0;
  function playEvent(ev){
    showing=true;var my=++token;
    ov.hidden=false;ov.className='';
    var at=function(ms,fn){setTimeout(function(){if(my===token)fn()},ms)};
    if(ev.kind!=='shield')revealSound();
    ov.innerHTML='<div class="dnr">Do not react.</div><p class="muted" style="margin-top:14px">Keep your phone close to your chest.</p>';
    at(2200,function(){ov.innerHTML='<p class="sub">You will be told in</p><div class="count">3</div>'});
    at(3200,function(){ov.innerHTML='<p class="sub">You will be told in</p><div class="count">2</div>'});
    at(4200,function(){ov.innerHTML='<p class="sub">You will be told in</p><div class="count">1</div>'});
    at(5200,function(){
      try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}
      ov.innerHTML='<div class="result tone-'+ev.tone+'"><div class="ev-title serif">'+esc(ev.title)+'</div><div class="bigword">'+esc(ev.big)+'</div>'+
        (ev.sub?'<p class="sub">'+esc(ev.sub)+'</p>':'')+
        (ev.allies&&ev.allies.length?'<div class="chips" style="justify-content:center;margin:10px 0">'+ev.allies.map(function(n){return '<span class="chip red">'+esc(n)+'</span>'}).join('')+'</div>':'')+
        '<button class="btn" id="evDone" style="margin-top:22px">Hide</button><p class="muted small">Hides by itself in a few seconds</p></div>';
      document.getElementById('evDone').onclick=finish;
      at(ev.kind==='end'?60000:14000,finish);
    });
    function finish(){if(my!==token)return;token++;me.seen=ev.seq;save();showing=false;ov.hidden=true;ov.innerHTML='';render()}
  }

  /* ---- hold-to-peek ---- */
  var peeking=false;
  function peekHtml(kind){
    var v=view,r=v.me.role,h='';
    if(kind==='secret'){
      if(r==='traitor'){h='<div class="result tone-traitor"><div class="ev-title serif">Secret orders</div>'+
        (v.mission&&v.mission.secret?'<p class="sub" style="font-size:22px">'+esc(v.mission.secret)+'</p>':'<p class="sub">No secret task this time. Blend in.</p>')+'</div>'}
      else h='<div class="result tone-faithful"><div class="ev-title serif">Private briefing</div><p class="sub" style="font-size:22px">No secret orders. You are Faithful. Complete the mission and watch for sabotage.</p></div>';
    } else {
      h='<div class="result tone-'+(r==='traitor'?'traitor':'faithful')+'"><div class="ev-title serif">You are</div><div class="bigword">'+(r==='traitor'?'Traitor':'Faithful')+'</div>'+
        (r==='traitor'?(v.allies&&v.allies.length?'<p class="sub">Fellow Traitors:</p><div class="chips" style="justify-content:center">'+v.allies.map(function(n){return '<span class="chip red">'+esc(n)+'</span>'}).join('')+'</div>':'<p class="sub">You are the only Traitor left standing.</p>'):'')+
        (r==='traitor'&&v.stash?'<p class="sub">Traitors\' stash: '+esc(money(v.stash))+'</p>':'')+
        (v.me.shield?'<p class="sub" style="color:var(--gold2)">🛡 You hold a Shield tonight.</p>':'')+'</div>';
    }
    return h+'<p class="muted small" style="margin-top:20px">Let go to hide</p>';
  }
  app.addEventListener('pointerdown',function(e){
    var b=e.target.closest('[data-peek]');if(!b||!view||showing)return;
    e.preventDefault();peeking=true;ov.hidden=false;ov.innerHTML=peekHtml(b.dataset.peek);
  });
  function endPeek(){if(peeking&&!showing){peeking=false;ov.hidden=true;ov.innerHTML=''}}
  window.addEventListener('pointerup',endPeek);window.addEventListener('pointercancel',endPeek);
  window.addEventListener('blur',endPeek);
  app.addEventListener('contextmenu',function(e){if(e.target.closest('[data-peek]'))e.preventDefault()});

  /* ---- screens ---- */
  function paintStatus(){var el=document.getElementById('pstatus');if(el)el.innerHTML=statusHtml();else if(!view)render()}
  function statusHtml(){return '<span><span class="dot '+(live?'on':'warn')+'"></span> '+esc(live?'Connected':status)+'</span><span>Room '+esc(ROOM)+' <button class="btn xs ghost" data-pact="mute" style="margin-left:6px">'+(muted?'🔇':'🔊')+'</button></span>'}
  function wrap(inner){return '<div class="wrap"><div class="status" id="pstatus">'+statusHtml()+'</div>'+ptimerHtml()+inner+'</div>'}
  function pLeft(){var t=view&&view.timer;if(!t)return 0;return t.running?Math.max(0,t.left-(Date.now()-view._recv)):t.left}
  function ptimerInner(l){return l<=0?'<span class="muted small">Timer</span><b style="color:var(--red2)">Time\'s up!</b>':'<span class="muted small">Time left</span><b>'+mmss(l)+'</b>'}
  function ptimerHtml(){if(!view||!view.timer||view.phase==='night'||view.phase==='end')return '';return '<div class="ptimer" id="ptimer">'+ptimerInner(pLeft())+'</div>'}
  setInterval(function(){var el=document.getElementById('ptimer');if(el&&view&&view.timer&&view.timer.running)el.innerHTML=ptimerInner(pLeft())},250);

  app.addEventListener('click',function(e){
    var b=e.target.closest('[data-pact]');if(!b)return;var a=b.dataset.pact;
    if(a==='join'){
      var n=(document.getElementById('pname').value||'').trim().slice(0,20);if(!n){document.getElementById('pname').focus();return}
      me.name=n;save();keepAwake();hello();render();
    } else if(a==='vote'){
      if(!view||!view.vote||!view.vote.open)return;var t=b.dataset.id;var target=view.vote.mine===t?null:t;
      view.vote.mine=target;render();send({t:'vote',target:target});
    } else if(a==='rename'){me.name='';save();rejected=null;render()}
    else if(a==='mute'){setMuted(!muted);unlockAudio();if(!muted)heart(0,.6);paintStatus()}
    else if(a==='fresh'){LS.del(KEY);location.reload()}
    else if(a==='home'){location.href=baseUrl()}
  });

  function render(){
    if(rejected){
      app.innerHTML=wrap('<div class="center" style="margin-top:12vh"><h2>The doors are closed</h2><p class="muted">'+esc(rejected.reason)+'</p>'+
        '<button class="btn" data-pact="fresh">Try again</button><button class="btn ghost" data-pact="home">Back</button></div>');return;
    }
    if(!me.name){
      app.innerHTML=wrap('<div class="center"><h1 class="serif title" style="margin-top:6vh">The Traitors</h1><p class="muted">Room '+esc(ROOM)+'</p></div>'+
        '<div class="card"><div class="label">Your name</div><input type="text" id="pname" maxlength="20" placeholder="What do they call you?" autocomplete="off" enterkeyhint="go">'+
        '<button class="btn gold" data-pact="join">Enter the castle</button></div><p class="muted small center">Keep this page open all game. If it closes, just open the link again and you\'ll be back in.</p>');
      var inp=document.getElementById('pname');inp.onkeydown=function(e){if(e.key==='Enter')app.querySelector('[data-pact=join]').click()};
      return;
    }
    if(!view){app.innerHTML=wrap('<div class="center" style="margin-top:20vh"><h2>Hello '+esc(me.name)+'</h2><p class="muted">'+esc(live?'Joining…':status)+'</p></div>');return}
    var v=view,h='';
    var gone=!v.me.alive;
    var deadBanner=gone?'<div class="banner dead">'+(v.me.fate==='banished'?'You were banished.':'You were murdered.')+' You\'re a ghost now: watch, but don\'t help!</div>':'';
    var potCard='<div class="card"><div class="label center">Prize fund</div><div class="pot">'+esc(money(v.pot))+'</div>'+(v.potMax>0?'<div class="potbar"><i style="width:'+Math.min(100,v.pot/v.potMax*100)+'%"></i></div>':'')+'</div>';
    var roster=function(){var a=v.players.filter(function(p){return p.alive}),d=v.players.filter(function(p){return !p.alive});
      return '<div class="card"><div class="label">Still in the castle ('+a.length+')</div><div class="chips">'+a.map(function(p){return '<span class="chip">'+esc(p.name)+'</span>'}).join('')+'</div>'+
      (d.length?'<div class="label" style="margin-top:14px">Gone</div>'+d.map(function(p){return '<div class="small" style="padding:3px 0"><b>'+esc(p.name)+'</b> <span class="muted">'+(p.fate==='banished'?'banished, was '+(p.role==='traitor'?'<span style="color:var(--red2)">a Traitor</span>':'Faithful'):'murdered')+'</span></div>'}).join(''):'')+'</div>'};
    var rolePeek=v.started?'<div class="hold" data-peek="role">Press and hold to see your role</div>':'';

    if(v.phase==='lobby'){

        '<div class="card"><div class="label">In the castle ('+v.players.length+')</div><div class="chips">'+v.players.map(function(p){return '<span class="chip">'+esc(p.name)+'</span>'}).join('')+'</div></div>'+
        '<button class="btn ghost sm" data-pact="rename">Change my name</button>';
    } else if(v.phase==='free'){
      h=deadBanner+'<h2 style="margin-top:16px">Round '+v.round+'</h2><p class="muted">Mingle. Scheme. Trust no one.</p>'+potCard+rolePeek+roster();
    } else if(v.phase==='mission'&&v.mission){
      var m=v.mission;
      h=deadBanner+'<div class="label" style="margin-top:16px">Mission</div><h2>'+esc(m.title)+'</h2><p>'+esc(m.desc)+'</p>'+
        '<div class="card">'+m.goals.map(function(g){return '<div class="goal '+(g.done?'done':'')+'"><span class="tick">'+(g.done?'✓':'')+'</span><span>'+esc(g.text)+'</span><span class="val">+'+esc(money(g.value))+'</span></div>'}).join('')+'</div>'+
        (m.shield?'<div class="card" style="border-color:var(--gold)"><div class="label" style="color:var(--gold2)">🛡 Shield up for grabs</div>'+esc(m.shield)+'<p class="muted small">The Shield protects you from murder tonight.</p></div>':'')+
        potCard+'<div class="hold" data-peek="secret">Press and hold for your private briefing</div><p class="muted small center">Everyone has one. Read it secretly.</p>';

        h+='<div class="card"><div class="label">The votes</div>'+(vt.results||[]).map(function(r){return '<div class="tally"><span>'+esc(r.from)+'</span><b>→ '+esc(r.to)+'</b></div>'}).join('')+'</div>';
      } else if(gone){h+='<p class="muted">Ghosts don\'t vote. Enjoy the show.</p>'}
      else if(vt.open){
        h+='<p class="muted">Tap who you want to banish. You can change your vote until Claudia locks it.</p>'+
          v.players.filter(function(p){return p.alive&&p.id!==v.me.id}).map(function(p){var on=vt.mine===p.id;

    } else if(v.phase==='night'){
      h='<div class="night"><div class="moon"></div><h2 style="color:#cfc8d8">Night has fallen</h2>'+

    } else if(v.phase==='end'){

    }
    else if(kind==='night'){
      st.innerHTML='<div class="inight" id="nd"></div><div class="imoon" id="nm"></div><div class="center" style="position:relative;z-index:2"><div id="nt" class="ibig" style="color:#cfc8d8">Night falls…</div><div id="np"></div></div>';
      at(100,function(){cls('nd','inight on');cls('nm','imoon on')});
      at(w('everyone closes'),function(){set('nt','Everyone, close your eyes')});
      at(w('The Traitors will wake'),function(){set('nt','<span class="red">Traitors, open your eyes</span>')});
      at(w('silently choose'),function(){set('nt','<span class="red">Choose your victim</span>');set('np','<div class="ipoint">👉</div>')});
      at(w('Or they may recruit'),function(){set('nt','<span class="red">…or recruit a Faithful</span>')});
      at(w('If you have been murdered'),function(){set('nt','<span class="grey">Ghosts may watch… in silence</span>');set('np','')});
    }
    else if(kind==='win'){
      st.innerHTML='<div class="iwin"><div class="icard" id="w1"><div class="ibadge gold">Faithful win</div><p class="tvtext">Banish every Traitor.<br>Share the prize fund.</p></div><div class="icard ihidden" id="w2"><div class="ibadge red">Traitors win</div><p class="tvtext">One Traitor survives to the end.<br>They take it all.</p></div></div>';
      at(w('But if even one'),function(){cls('w2','icard')});
    }
    else if(kind==='rules'){
      var L=['📵 Never show your phone','👻 Ghosts never speak','⚖️ The host’s word is final'],LT=[w('Never show'),w('Ghosts never'),w('And the host')];
      st.innerHTML='<div class="irules">'+L.map(function(l,i){return '<div class="irule" id="ru'+i+'">'+l+'</div>'}).join('')+'</div>';
      L.forEach(function(_,i){at(LT[i],function(){cls('ru'+i,'irule on')})});
    }
    else if(kind==='begin'){
      var qr='';try{if(view&&typeof qrcode!=='undefined'){var q=qrcode(0,'M');q.addData(view.joinUrl);q.make();qr=q.createSvgTag(6,2)}}catch(e){}
      st.innerHTML='<div class="tvqr" style="width:22vw">'+qr+'</div><div><div class="ibig gold" style="text-align:left">Enter the castle</div><p class="tvtext">Room code <span class="roomcode" style="font-size:3vw">'+esc(ROOM)+'</span></p></div>';
    }
  }
  render();makePeer();
}

if(!ROOM) landing(); else if(IS_HOST) hostMain(); else if(IS_TV) tvMain(); else playerMain();
})();
</script>
</body>
</html>
